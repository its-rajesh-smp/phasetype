appId: ai.phasetype.app
productName: PhaseType
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# The Accessibility helper, built by scripts/build-ax-helper.sh.
extraResources:
  - from: native/bin/phasetype-ax
    to: phasetype-ax
mac:
  category: public.app-category.productivity
  icon: assets/icon/icon.icns
  # Ad-hoc signature: free, no Apple account. Replace with a "Developer ID Application" identity to distribute publicly.
  identity: "-"
  target:
    - target: dmg
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: PhaseType sends copy and paste keystrokes to the app you are writing in.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName}
  # Drawn by scripts/dmg-background.py (background@2x.png is picked up for Retina). Keep the sizes and positions in sync with it.
  background: build/background.png
  iconSize: 96
  iconTextSize: 13
  window:
    width: 600
    height: 400
  contents:
    - x: 170
      y: 220
    - x: 430
      y: 220
      type: link
      path: /Applications
