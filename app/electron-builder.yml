appId: ai.phasetype.app
productName: PhaseType
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# The native helpers, built by scripts/build-helpers.sh.
extraResources:
  - from: native/bin/phasetype-ax
    to: phasetype-ax
  - from: native/bin/phasetype-media
    to: phasetype-media
mac:
  category: public.app-category.productivity
  icon: assets/icon/icon.icns
  # Ad-hoc signature: free, no Apple account. Replace with a "Developer ID Application" identity to distribute publicly.
  identity: "-"
  # dmg for the download page, zip for install.sh. Names have no version so ".../releases/latest/download/<name>" always works.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: PhaseType sends copy and paste keystrokes to the app you are writing in.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
zip:
  artifactName: ${productName}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${arch}.${ext}
  title: ${productName}
  # Drawn by scripts/dmg-background.py (background@2x.png is picked up for Retina). Keep the sizes and positions in sync with it.
  background: build/background.png
  iconSize: 96
  iconTextSize: 13
  window:
    width: 600
    height: 400
  contents:
    - x: 170
      y: 220
    - x: 430
      y: 220
      type: link
      path: /Applications
# `yarn release:mac` uploads the files to a draft GitHub release tagged v<version>. Write the notes there, then publish.
publish:
  provider: github
  owner: its-rajesh-smp
  repo: phasetype
  releaseType: draft
